name: CI

# Docs-only changes skip this suite (pre-production 2026-10-21: faster CI);
# docs.yml runs the name guard on them instead.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tests never call an outside service: every outside base URL points at the
# discard port, so an accidental call fails fast (M2 contract 0.5).
env:
  TOAST_API_BASE: http://127.0.0.1:9
  TOAST_ANALYTICS_BASE: http://127.0.0.1:9
  WHAPI_BASE_URL: http://127.0.0.1:9

jobs:
  backend:
    # The real suite: PostgreSQL 16, like production (platform contract 18.1).
    # PGTZ puts the test sessions in a non-UTC zone on purpose: stored
    # timestamps must not depend on the connection's TimeZone.
    name: Backend tests (PostgreSQL 16, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retailops
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retailops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RETAILOPS_TEST_DB: postgres
      RETAILOPS_TEST_PG_URL: postgresql+psycopg://retailops@127.0.0.1:5432/postgres
      RETAILOPS_TEST_DB_PREFIX: so_ci
      PGTZ: America/New_York
      # The process clock in the test store's zone: some ordering routes
      # default to the server's date (dt.date.today()), so between 00:00 and
      # ~05:00 UTC a UTC runner is a day ahead of the store and 11 tests fail.
      # Known defect, deferred (PLATFORM_CONTRACT "As built - Integration").
      TZ: America/New_York
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Tesseract (invoice OCR text layer)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - name: Store migrations on PostgreSQL (baseline 0062 + chain to head, twice)
        run: |
          set -eux
          psql "postgresql://retailops@127.0.0.1:5432/postgres" -c "CREATE DATABASE so_ci_chain TEMPLATE template0 LC_COLLATE 'C' LC_CTYPE 'C'"
          alembic -x db_url=postgresql+psycopg://retailops@127.0.0.1:5432/so_ci_chain upgrade head
          alembic -x db_url=postgresql+psycopg://retailops@127.0.0.1:5432/so_ci_chain upgrade head
          alembic -x db_url=postgresql+psycopg://retailops@127.0.0.1:5432/so_ci_chain current | grep "(head)"
      - name: The PostgreSQL baseline matches the SQLite chain at 0062
        run: python scripts/pg/make_baseline.py --check
      - name: Migration round trip (platform DB, store DBs, provisioning, migrate-all)
        run: python scripts/pg/migration_roundtrip.py --pg-url "$RETAILOPS_TEST_PG_URL" --prefix so_ci_mig
      - name: pytest (PostgreSQL)
        run: python -m pytest -q -p no:cacheprovider

  backend-sqlite:
    # Single-instance (M2) stores and quick local runs still use SQLite.
    name: Backend tests (SQLite, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RETAILOPS_TEST_DB: sqlite
      TZ: America/New_York  # the test store's zone (see the PostgreSQL job)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Tesseract (invoice OCR text layer)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - name: Store migrations on SQLite (full chain)
        run: |
          set -eux
          DATABASE_URL=sqlite:///$RUNNER_TEMP/chain.db alembic upgrade head
          DATABASE_URL=sqlite:///$RUNNER_TEMP/chain.db alembic current | grep "(head)"
      - name: pytest (SQLite)
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Website tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: node --test
        run: node --test $(find src -name '*.test.mjs' | sort)
      - name: vite build
        run: npx vite build
      - name: Built page carries the product name
        run: grep -q "<title>KloudC RetailOps</title>" dist/index.html

  docker:
    name: Docker image build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kloudc-retailops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image holds no secrets or store data and runs as non-root
        run: |
          set -eux
          test "$(docker run --rm --entrypoint id kloudc-retailops:ci -u)" != "0"
          found=$(docker run --rm --entrypoint sh kloudc-retailops:ci -c 'find /app /data \( -name ".env" -o -name "*.db" -o -name "*.key" -o -name "*.pem" -o -name "*.p8" -o -name "*.p12" -o -name "google-services.json" -o -name "GoogleService-Info.plist" -o -name "firebase-service-account*.json" -o -name "*.csv" -o -name "*.tsv" \) 2>/dev/null')
          echo "found: ${found:-none}"
          test -z "$found"
          docker run --rm --entrypoint sh kloudc-retailops:ci -c 'test ! -e /app/backend/tests && test -f /app/frontend/dist/index.html && command -v tesseract && tesseract --version | head -1'

      - name: Compose config is valid
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile backup config -q

      - name: Boot on an empty database (compose)
        run: |
          set -eux
          {
            echo "COMPOSE_PROJECT_NAME=retailops-ci"
            echo "STORE_CODE=RETAILOPS_CI"
            echo "RETAILOPS_IMAGE=kloudc-retailops:ci"
            echo "TOAST_API_BASE=http://127.0.0.1:9"
            echo "TOAST_ANALYTICS_BASE=http://127.0.0.1:9"
            echo "WHAPI_BASE_URL=http://127.0.0.1:9"
          } >> .env
          # A new store is set up once (store pack + identity stamp) before
          # its first start; the server refuses to start without the stamp.
          docker compose run --rm --no-deps store sh -c \
            "alembic upgrade head && python -m app.store init --code RETAILOPS_CI --pack packs/generic.json"
          docker compose up -d --no-build store
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health)" = "200"
          curl -fsS http://127.0.0.1:8000/ | grep -q "<title>KloudC RetailOps</title>"
          docker compose exec -T store alembic current | tee /tmp/alembic.txt
          grep -q "(head)" /tmp/alembic.txt
          # Docker's own health check turns healthy (start period 60 s).
          for i in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q store)")
            [ "$status" = "healthy" ] && break
            sleep 4
          done
          test "$status" = "healthy"

      - name: Restart on the existing database
        run: |
          set -eux
          docker compose restart store
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health)" = "200"
          test "$(docker compose ps --status running -q store | wc -l)" = "1"

      - name: Store logs
        if: always()
        run: docker compose logs --no-color store | tail -n 200 || true

      - name: Stop
        if: always()
        run: docker compose down -v || true

      - name: Full backend suite inside the image
        run: |
          docker run --rm --user root --entrypoint sh \
            -e TOAST_API_BASE -e TOAST_ANALYTICS_BASE -e WHAPI_BASE_URL \
            -e RETAILOPS_TEST_DB=sqlite -e TZ=America/New_York \
            -v "$PWD:/repo" -w /repo/backend kloudc-retailops:ci \
            -c "pip install -q pytest==8.3.3 time-machine==2.16.0 && python -m pytest -q -p no:cacheprovider"
