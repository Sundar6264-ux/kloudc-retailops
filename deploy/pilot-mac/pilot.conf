# KloudC RetailOps - pilot on this Mac (docs/PILOT_RUNBOOK.md).
# Defaults for install.sh / prepare.sh / start-server.sh / update.sh. Every
# value can be overridden from the environment (e.g. PILOT_ROOT=/tmp/x).
# No secrets here: the key ring is generated into $PILOT_ROOT/secrets/.

# Everything the pilot owns: release checkout, database cluster, uploads,
# logs, backups, config and secrets.
: "${PILOT_ROOT:=$HOME/kloudc-retailops}"
# The release checkout is cloned from here (a local path or a git URL) at this ref.
: "${PILOT_SOURCE_REPO:=/Users/sundar/storeops/storeops}"
: "${PILOT_REF:=main}"
# The pilot's own PostgreSQL 16 cluster (NOT the dev cluster on 5433).
: "${PILOT_PG_BIN:=/opt/homebrew/opt/postgresql@16/bin}"
: "${PILOT_PG_PORT:=5434}"
: "${PILOT_PG_ROLE:=retailops}"
# The app listens on 127.0.0.1 only; Tailscale serve (or a tunnel) is the way in.
: "${PILOT_APP_PORT:=8900}"
: "${PILOT_PYTHON:=/opt/homebrew/bin/python3.12}"
# Tailnet HTTPS port for `tailscale serve` (443, 8443 and 10000-10002 are taken on this Mac).
: "${PILOT_TS_HTTPS_PORT:=10003}"
# Nightly backup (store time of the Mac), monthly restore drill, daily parity.
: "${PILOT_BACKUP_HOUR:=3}"
: "${PILOT_BACKUP_MINUTE:=15}"
: "${PILOT_PARITY_HOUR:=7}"
: "${PILOT_PARITY_MINUTE:=30}"
: "${PILOT_KEEP_DAYS:=30}"
# launchd labels (only these are ever installed, started or stopped).
PILOT_LABEL_PREFIX="com.kloudc.retailops.pilot"
