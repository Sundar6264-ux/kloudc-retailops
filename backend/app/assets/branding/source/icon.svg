<!-- App icon: Plane-R (owner's pick 2026-10-22) - a white R whose bowl is the
     KloudC paper plane, with a sky-blue fold, on KloudC blue. Full-bleed square
     (iOS masks the corners). icon-1024.png is this, rendered. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A5CC4"/>
      <stop offset="1" stop-color="#004BAD"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(-20 0)">
    <!-- stem + upper wing of the plane, one white sheet -->
    <path d="M214 180 L360 180 L850 400 L360 452 L360 844 L214 844 Z" fill="#FFFFFF"/>
    <!-- folded lower wing -->
    <polygon points="360,452 850,400 360,640" fill="#2EA3F2"/>
    <!-- leg -->
    <polygon points="476,583 622,512 834,844 668,844" fill="#FFFFFF"/>
  </g>
</svg>
