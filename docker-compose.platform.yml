# The shared KloudC RetailOps service (docs/PLATFORM_CONTRACT.md section 2):
# TENANCY_MODE=multi, one PostgreSQL 16 with the platform database
# (so_platform) and one database per store.
#
#   cp backend/.env.example .env.platform    # fill the secrets (never in git):
#                                            #   RETAILOPS_SECRET_KEYS (python -m app.platform gen-key),
#                                            #   POSTGRES_PASSWORD, PLATFORM_DOMAIN, ...
#   docker compose -f docker-compose.platform.yml up -d db
#   docker compose -f docker-compose.platform.yml run --rm app python -m app.platform migrate-platform
#   docker compose -f docker-compose.platform.yml run --rm app python -m app.platform create-master --username <you>
#   docker compose -f docker-compose.platform.yml up -d
#
# Releases: `python -m app.platform migrate-all` (platform DB + every shared store).
#
# Client IPs (login lockout, sign-up / lookup rate limits): behind the reverse
# proxy or tunnel set DIRECTORY_CLIENT_IP_HEADER or FORWARDED_ALLOW_IPS in
# .env.platform (see backend/.env.example) - otherwise every visitor is the
# proxy's address and 30 bad logins anywhere lock every store out.
# A dedicated store server: docs/DEDICATED_HOSTING_RUNBOOK.md.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: retailops_admin          # CREATEDB: provisioning creates store databases
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: so_platform
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailops_admin -d so_platform"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: ${RETAILOPS_IMAGE:-kloudc-retailops:local}
    env_file:
      - .env.platform
    environment:
      TENANCY_MODE: multi
      PLATFORM_DATABASE_URL: postgresql+psycopg://retailops_admin:${POSTGRES_PASSWORD}@db:5432/so_platform
      STORE_DATABASE_URL_TEMPLATE: postgresql+psycopg://retailops_admin:${POSTGRES_PASSWORD}@db:5432/{db_name}
      PG_ADMIN_URL: postgresql+psycopg://retailops_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      # Each store's files: /data/uploads/<STORE_CODE>/...
      UPLOADS_ROOT: /data/uploads
      FRONTEND_DIST_DIR: /app/frontend/dist
    ports:
      - "${PLATFORM_HTTP_BIND:-127.0.0.1}:${PLATFORM_HTTP_PORT:-8000}:8000"
    volumes:
      - platform-files:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pg-data:
  platform-files:
