# The shared KloudC RetailOps service (docs/PLATFORM_CONTRACT.md section 2):
# TENANCY_MODE=multi, one PostgreSQL 16 with the platform database
# (so_platform) and one database per store.
#
# A cloud VM (docs/PILOT_RUNBOOK.md "Cloud VM"):
#   cp deploy/cloud-vm/env.platform.example .env.platform && chmod 600 .env.platform
#                                            # fill the secrets (never in git):
#                                            #   RETAILOPS_SECRET_KEYS (python -m app.platform gen-key),
#                                            #   POSTGRES_PASSWORD, PLATFORM_HOST, ...
#   docker compose -f docker-compose.platform.yml up -d db
#   docker compose -f docker-compose.platform.yml run --rm app python -m app.platform migrate-platform
#   docker compose -f docker-compose.platform.yml run --rm app python -m app.platform create-master --username <you>
#   docker compose -f docker-compose.platform.yml --profile https --profile backup up -d
#
# Releases: the app container runs migrate-platform + migrate-all (platform
# DB + every shared store) on every start (docker/entrypoint.sh).
# Probes: /api/health (alive) and /api/ready (databases answer, migrated).
#
# Client IPs (login lockout, sign-up / lookup rate limits): behind the reverse
# proxy or tunnel set DIRECTORY_CLIENT_IP_HEADER or FORWARDED_ALLOW_IPS in
# .env.platform (see backend/.env.example) - otherwise every visitor is the
# proxy's address and 30 bad logins anywhere lock every store out.
# A dedicated store server: docs/DEDICATED_HOSTING_RUNBOOK.md.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: retailops_admin          # CREATEDB: provisioning creates store databases
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: so_platform
    # One database per store: 40 open stores x 5 pooled connections + reserve
    # (TENANT_MAX_ENGINES; the app refuses to start when it does not fit).
    command: ["postgres", "-c", "max_connections=250", "-c", "shared_buffers=512MB", "-c", "timezone=UTC"]
    shm_size: 256mb
    stop_grace_period: 60s
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailops_admin -d so_platform"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: ${RETAILOPS_IMAGE:-kloudc-retailops:local}
    env_file:
      - .env.platform
    environment:
      TENANCY_MODE: multi
      PLATFORM_DATABASE_URL: postgresql+psycopg://retailops_admin:${POSTGRES_PASSWORD}@db:5432/so_platform
      STORE_DATABASE_URL_TEMPLATE: postgresql+psycopg://retailops_admin:${POSTGRES_PASSWORD}@db:5432/{db_name}
      PG_ADMIN_URL: postgresql+psycopg://retailops_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      # Each store's files: /data/uploads/<STORE_CODE>/...
      UPLOADS_ROOT: /data/uploads
      FRONTEND_DIST_DIR: /app/frontend/dist
    ports:
      - "${PLATFORM_HTTP_BIND:-127.0.0.1}:${PLATFORM_HTTP_PORT:-8000}:8000"
    volumes:
      - platform-files:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  # HTTPS for PLATFORM_HOST (e.g. app.kloudc.com -> this VM's IP, a DNS A
  # record). Profile "https".
  caddy:
    image: caddy:2
    profiles: ["https"]
    env_file:
      - .env.platform
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/cloud-vm/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped

  # Nightly pg_dump of the platform database and every store database, kept
  # BACKUP_KEEP_DAYS days in the "backups" volume, plus a monthly restore
  # drill (backend/scripts/backup/backup_all.py). Copy the volume off the
  # machine. Profile "backup"; one run now:
  #   docker compose -f docker-compose.platform.yml run --rm backup now
  backup:
    build:
      context: .
      dockerfile: deploy/cloud-vm/backup.Dockerfile
    profiles: ["backup"]
    env_file:
      - .env.platform
    environment:
      BACKUP_PLATFORM_URL: postgresql://retailops_admin@db:5432/so_platform
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  platform-files:
  caddy-data:
  backups:
